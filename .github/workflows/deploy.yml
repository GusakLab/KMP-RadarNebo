name: Deploy server to OCI

# Deploys come from main only: a push to main that touches the server, or a manual run on main (redeploy or rollback).
# Pull requests never deploy; ci.yml tests them. The `main` checks on the jobs below are the visible half. The lock is
# the `production` environment: only main may deploy to it, and it holds the deploy secrets, so a branch that edits
# this file (a branch runs its own copy of it) still gets none of them.
on:
  push:
    branches: ["main"]
    paths:
      - "core/**"
      - "mission-control/server/**"
      - "buildSrc/**"
      - "gradle/**"
      - "*.gradle.kts"
      - "gradle.properties"
      - ".github/workflows/deploy.yml"
  workflow_dispatch:  # manual redeploy from the Actions tab (e.g. after rotating ALERTS_IN_UA_API_KEY or CLIENT_KEYS)
    inputs:
      image_tag:  # rollback: redeploys an image main already pushed to Docker Hub, skipping tests, build and scan
        description: Deploy the image of this earlier main commit (full sha) instead of building
        type: string
        required: false

permissions:
  contents: read

env:
  APP_DIR: docker-deployments/apps/radarnebo/radarnebo-server
  # Caddy gets and renews its Let's Encrypt certificate for it; a repository variable DOMAIN overrides it.
  DOMAIN: ${{ vars.DOMAIN || 'radar-nebo.worxbend.com' }}

jobs:
  test:
    # A manual run can be started on any branch: only main's runs go on. A rollback (image_tag) deploys an image that
    # was tested when it was built.
    if: github.ref == 'refs/heads/main' && inputs.image_tag == ''
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - name: Test and build the fat jar
        run: ./gradlew :core:jvmTest :mission-control:server:test :mission-control:server:buildFatJar
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: server-jar
          path: mission-control/server/build/libs/server-all.jar
          retention-days: 7

  build-and-deploy:
    needs: test
    # test is skipped only for a rollback; any other skip (a run off main) skips the deploy too.
    if: >-
      !cancelled() && github.ref == 'refs/heads/main' && (
        needs.test.result == 'success' ||
        (needs.test.result == 'skipped' && inputs.image_tag != ''))
    # Only main may deploy to it (its deployment branch policy), and the deploy secrets live in it, not in the repository.
    environment:
      name: production
      url: https://${{ env.DOMAIN }}
    # Deploys run one after the other, never side by side; a newer one waits instead of cancelling the one running.
    concurrency:
      group: deploy-oci
      cancel-in-progress: false
    runs-on: ubuntu-latest
    env:
      # On the job, not the workflow: environment secrets reach only the job that names the environment.
      IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/radarnebo-server
      TAG: ${{ inputs.image_tag || github.sha }}
    steps:
      - id: checkout
        name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # A rollback needs main's whole history to check that image_tag is one of its commits.
          fetch-depth: ${{ inputs.image_tag == '' && 1 || 0 }}
          persist-credentials: false
      - name: Check image_tag
        if: inputs.image_tag != ''
        env:
          IMAGE_TAG: ${{ inputs.image_tag }}
        run: |
          # Images are tagged with the full sha only, so a short one would fail later, at the pull on the VM.
          [[ "$IMAGE_TAG" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::image_tag must be a full 40-character commit sha"; exit 1; }
          # Pull request deploys once pushed images of unmerged branches too; only main's own commits may go live.
          git merge-base --is-ancestor "$IMAGE_TAG" HEAD 2>/dev/null ||
            { echo "::error::image_tag $IMAGE_TAG is not a commit on main"; exit 1; }
      - name: Download the fat jar
        if: inputs.image_tag == ''
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: server-jar
          path: mission-control/server/build/libs
      - name: Login to Docker Hub
        if: inputs.image_tag == ''
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_PASSWORD }}
      - id: setup-qemu
        name: Set up QEMU
        if: inputs.image_tag == ''
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - id: setup-builder
        name: Set up Docker Buildx
        if: inputs.image_tag == ''
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      # One multi-arch build, pushed under the sha only. Trivy then scans what was pushed for both architectures
      # (OCI's Always Free Ampere A1 VMs are arm64) before anything deploys or :latest moves.
      - id: build
        name: Build and push
        if: inputs.image_tag == ''
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          platforms: linux/amd64,linux/arm64/v8
          context: mission-control/server
          push: true
          tags: ${{ env.IMAGE }}:${{ github.sha }}
          # A new value each run, so the Dockerfile's apt upgrade takes today's Ubuntu security fixes instead of
          # coming from the cache. A rerun of the same run reuses it.
          build-args: UPGRADE_ID=${{ github.run_id }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Scan arm64 image (Trivy)
        if: inputs.image_tag == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/arm64
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      - name: Scan amd64 image (Trivy)
        if: inputs.image_tag == ''
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: linux/amd64
          TRIVY_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          TRIVY_PASSWORD: ${{ secrets.DOCKERHUB_PASSWORD }}
        with:
          image-ref: ${{ env.IMAGE }}:${{ github.sha }}
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
      # :latest moves only to an image both scans passed; a rollback leaves it alone.
      - name: Tag latest
        if: inputs.image_tag == ''
        run: docker buildx imagetools create -t "${IMAGE}:latest" "${IMAGE}:${GITHUB_SHA}"
      - name: Copy compose file and Caddyfile to remote machine
        uses: appleboy/scp-action@ff85246acaad7bdce478db94a363cd2bf7c90345 # v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          # The ECDSA host key's fingerprint: these actions' Go client negotiates ECDSA first, never ed25519.
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          source: mission-control/server/docker-compose.yaml,mission-control/server/Caddyfile
          target: ${{ env.APP_DIR }}
          strip_components: 2
      # The compose file's ${CLIENT_KEYS:?} only rejects an empty value; "," or " " would still start an open API.
      - name: Check CLIENT_KEYS holds a key
        env:
          CLIENT_KEYS: ${{ secrets.CLIENT_KEYS }}
        run: '[[ "$CLIENT_KEYS" =~ [^,[:space:]] ]] || { echo "::error::CLIENT_KEYS secret holds no key"; exit 1; }'
      - id: deploy
        name: Connect to remote machine and deploy
        env:
          # Passed via envs:, never pasted into the script (the image tag can come from the image_tag input). Empty
          # ALERTS_API_TOKEN runs the simulation; an empty CLIENT_KEYS fails the deploy (the compose file requires it)
          # instead of exposing an open API.
          RADARNEBO_SERVER_IMAGE: ${{ env.IMAGE }}:${{ env.TAG }}
          ALERTS_API_TOKEN: ${{ secrets.ALERTS_IN_UA_API_KEY }}
          CLIENT_KEYS: ${{ secrets.CLIENT_KEYS }}
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          fingerprint: ${{ secrets.SSH_HOST_FINGERPRINT }}
          envs: RADARNEBO_SERVER_IMAGE,ALERTS_API_TOKEN,CLIENT_KEYS,DOMAIN
          script: |
            set -e  # this ssh-action carries on after a failed command otherwise
            cd $PWD/${{ env.APP_DIR }}
            docker pull "$RADARNEBO_SERVER_IMAGE"
            # Compose reads .env from here, so a manual `docker compose ps/logs/up` on the VM works too.
            # One line per value: none of them may contain a newline. rm first: umask applies only to a new file.
            (rm -f .env; umask 077; printf 'RADARNEBO_SERVER_IMAGE=%s\nDOMAIN=%s\nALERTS_API_TOKEN=%s\nCLIENT_KEYS=%s\n' \
              "$RADARNEBO_SERVER_IMAGE" "$DOMAIN" "$ALERTS_API_TOKEN" "$CLIENT_KEYS" > .env)
            # --wait fails the deploy if the container doesn't turn healthy (the start replays 2 h of history).
            docker compose up -d --wait --wait-timeout 180
            # Only this app's unused images: the VM is shared, and the image in use is kept.
            docker image prune -af --filter label=org.opencontainers.image.title=radarnebo-server
      # From outside, through Caddy, TLS, DNS and the firewall, which the container healthcheck never touches.
      - name: Check https://DOMAIN/health
        run: curl -fsS --retry 12 --retry-delay 5 --retry-all-errors "https://${DOMAIN}/health" | jq -e '.status'
